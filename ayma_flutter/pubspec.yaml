name: ayma
description: "Ayma — your personal AI matchmaker"
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.1
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.6
  firebase_app_check: ^0.3.2+10
  # Navigation
  go_router: ^13.2.4

  # State
  flutter_riverpod: ^2.5.1

  # Audio
  flutter_sound: ^9.2.13
  permission_handler: ^11.3.1

  # Network
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  js: ^0.7.2

  # UI
  intl_phone_field: ^3.2.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Utils
  speech_to_text: ^7.0.0
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.3.2
  logger: ^2.4.0
  image_picker: ^1.1.2
  flutter_markdown: ^0.7.7+1
  flutter_overlay_window: ^0.5.0
  sign_in_with_apple: ^7.0.1
  audio_session: ^0.2.3
  livekit_client: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.woff2
          weight: 300
        - asset: assets/fonts/Geist-Regular.woff2
          weight: 400
        - asset: assets/fonts/Geist-Medium.woff2
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.woff2
          weight: 600
